<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="maskGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>
    <linearGradient id="goldMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
  </defs>

  <!-- Full Bleed Maskable Background -->
  <rect width="512" height="512" fill="url(#maskGrad)" />

  <!-- Safe Zone Graphic Center (within 80% circle) -->
  <g transform="translate(100, 100)">
    <!-- Castle Sillhouette -->
    <path d="M 40 260 L 40 170 L 75 170 L 75 125 L 100 125 L 100 95 L 125 95 L 125 125 L 150 125 L 150 170 L 165 170 L 165 125 L 190 125 L 190 95 L 215 95 L 215 125 L 240 125 L 240 170 L 275 170 L 275 260 Z" fill="#451a03" opacity="0.35" />

    <!-- Golden Ticket Center -->
    <g transform="translate(25, 45) rotate(-6)">
      <rect x="0" y="0" width="200" height="110" rx="14" fill="#fffbeb" stroke="#f59e0b" stroke-width="5"/>
      <circle cx="0" cy="55" r="14" fill="#d97706" />
      <circle cx="200" cy="55" r="14" fill="#d97706" />
      <line x1="60" y1="10" x2="60" y2="100" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="6 5"/>
      <rect x="18" y="28" width="28" height="28" rx="5" fill="#d97706" />
      <rect x="78" y="28" width="95" height="14" rx="4" fill="#b45309" />
      <rect x="78" y="50" width="65" height="10" rx="3" fill="#d97706" opacity="0.85" />
      <rect x="78" y="68" width="80" height="10" rx="3" fill="#f59e0b" opacity="0.75" />
    </g>

    <!-- Star Shield of Safety -->
    <g transform="translate(170, 150)">
      <polygon points="45,0 58,28 90,33 67,56 73,87 45,72 17,87 23,56 0,33 32,28" fill="url(#goldMask)" stroke="#92400e" stroke-width="2.5"/>
      <path d="M 45 22 C 56 22, 64 30, 64 41 C 64 60, 45 71, 45 71 C 45 71, 26 60, 26 41 C 26 30, 34 22, 45 22 Z" fill="#059669" />
      <path d="M 36 43 L 42 49 L 54 36" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
